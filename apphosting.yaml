# Firebase App Hosting configuration.
# Non-secret values live here; the service-account private key is stored in
# Cloud Secret Manager (secret: firebase-admin-private-key) and referenced below.

runConfig:
  minInstances: 0

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDyfHXRDfbY0PjVUlaqLXZJKVUMEyFT6zo"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "caie-biology.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "caie-biology"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "caie-biology.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "361372107177"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:361372107177:web:1c38176250e1c8810504b8"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: "caie-biology"
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: "firebase-adminsdk-fbsvc@caie-biology.iam.gserviceaccount.com"
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key
    availability:
      - RUNTIME
